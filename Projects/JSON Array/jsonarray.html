<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>From Page to Screen | Emmanuel Deyto</title>
    <link rel="icon" type="image/jpeg" href="assets/img/pfp.jpg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- ICONS -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    </svg>

    <!-- PAGE HEADER -->

    <header class="page-hero">
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>

        <div class="container">
            <span class="pill"><span class="pill-dot"></span>JSON Array project</span>
            <h1 class="gold-text">From Page to Screen</h1>
            <p>Ten manhwa that left the page and landed on screen: five as anime and five as live-action series.</p>

            <div class="stats">
                <div class="stat"><strong id="stat-total">0</strong><span>Titles</span></div>
                <div class="stat"><strong id="stat-anime">0</strong><span>Anime</span></div>
                <div class="stat"><strong id="stat-live">0</strong><span>Live action</span></div>
            </div>
        </div>
    </header>

    <!-- LIST -->

    <main class="page-body">
        <div class="container">

            <div class="filters" role="group" aria-label="Filter the list">
                <button type="button" class="filter-btn is-active" data-filter="all" aria-pressed="true">All</button>
                <button type="button" class="filter-btn" data-filter="anime" aria-pressed="false">Anime</button>
                <button type="button" class="filter-btn" data-filter="live" aria-pressed="false">Live action</button>
            </div>

            <p class="result-count" id="result-count" aria-live="polite"></p>

            <!-- The cards are built from the "adaptations" array in the script below -->
            <div class="screen-grid" id="grid"></div>
            <noscript><p class="result-count">This page needs JavaScript to show the list.</p></noscript>

            <div class="back-row">
                <a href="../webdev.html" class="button button-outline">
                    <svg class="icon"><use href="#i-back"/></svg>Back to Web Development
                </a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->

    <footer class="site-footer">
        <img src="assets/img/banner.png" class="footer-logo" alt="ITANI logo" onerror="this.remove()">
        © 2026 Deyto's Portfolio
    </footer>

    <script>
        // Folder that holds the poster images
        const IMAGE_FOLDER = "assets/img/";

        // The JSON array: one object per title.
        // type is "anime" or "live"
        const adaptations = [
            {
                title: "Solo Leveling",
                type: "anime",
                year: "2024",
                by: "A-1 Pictures",
                image: "solo-leveling.webp",
                summary: "Sung Jinwoo is the weakest hunter in a world full of dungeons, until a mysterious system lets him level up without limits."
            },
            {
                title: "Tower of God",
                type: "anime",
                year: "2020",
                by: "Telecom Animation Film",
                image: "tower-of-god.webp",
                summary: "Bam enters a mysterious tower to find his only friend, Rachel, and has to survive dangerous tests on every floor."
            },
            {
                title: "The God of High School",
                type: "anime",
                year: "2020",
                by: "MAPPA",
                image: "god-of-high-school.webp",
                summary: "Fighters from high schools across Korea enter a martial arts tournament where the winner gets any wish granted."
            },
            {
                title: "Noblesse",
                type: "anime",
                year: "2020",
                by: "Production I.G",
                image: "noblesse.webp",
                summary: "Raizel, a powerful noble, wakes up after 820 years of sleep and tries to live quietly as a high school student."
            },
            {
                title: "Lookism",
                type: "anime",
                year: "2022",
                by: "Netflix",
                image: "lookism.webp",
                summary: "Daniel Park, bullied for his looks, wakes up with a second, taller body and starts living two very different lives."
            },
            {
                title: "Sweet Home",
                type: "live",
                year: "2020",
                by: "Netflix",
                image: "sweet-home.webp",
                summary: "A lonely teenager moves into an apartment building just as residents start turning into monsters, and the survivors must fight to stay human."
            },
            {
                title: "Weak Hero",
                type: "live",
                year: "2022 and 2025",
                by: "Wavve and Netflix",
                image: "weak-hero.webp",
                summary: "Yeon Si-eun looks like an easy target, but he uses sharp observation and planning to beat stronger opponents."
            },
            {
                title: "True Beauty",
                type: "live",
                year: "2020",
                by: "tvN",
                image: "true-beauty.webp",
                summary: "Lim Ju-kyung hides her real face behind makeup at her new school, until two classmates start to see through it."
            },
            {
                title: "What's Wrong with Secretary Kim",
                type: "live",
                year: "2018",
                by: "tvN",
                image: "secretary-kim.webp",
                summary: "A vain vice-chairman depends on his perfect secretary, Kim Mi-so, until she announces that she is quitting."
            },
            {
                title: "Itaewon Class",
                type: "live",
                year: "2020",
                by: "JTBC",
                image: "itaewon-class.webp",
                summary: "After a loss that changes his life, Park Sae-ro-yi opens a small restaurant in Itaewon to take on the powerful company behind it."
            }
        ];

        const LABELS = { anime: "Anime", live: "Live action" };

        const grid = document.getElementById("grid");
        const countText = document.getElementById("result-count");
        const buttons = document.querySelectorAll(".filter-btn");

        function make(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function buildCard(item, number, order) {
            const card = make("article", "screen-card");
            card.style.setProperty("--i", order);

            // image area (the title shows if the image is missing)
            const poster = make("div", "screen-poster");
            poster.appendChild(make("span", "adapt-badge", LABELS[item.type]));
            poster.appendChild(make("span", "screen-num", String(number).padStart(2, "0")));
            poster.appendChild(make("span", "", item.title));

            const img = document.createElement("img");
            img.src = IMAGE_FOLDER + item.image;
            img.alt = item.title;
            img.loading = "lazy";
            img.addEventListener("error", function () { img.remove(); });
            poster.appendChild(img);

            // text area
            const body = make("div", "screen-body");
            body.appendChild(make("h3", "", item.title));

            const chips = make("ul", "chip-list");
            chips.appendChild(make("li", "chip", item.year));
            chips.appendChild(make("li", "chip", item.by));
            body.appendChild(chips);

            body.appendChild(make("p", "", item.summary));

            card.appendChild(poster);
            card.appendChild(body);
            return card;
        }

        function render(filter) {
            grid.innerHTML = "";
            let shown = 0;

            adaptations.forEach(function (item, index) {
                if (filter !== "all" && item.type !== filter) return;
                // the number stays the same when filtering
                grid.appendChild(buildCard(item, index + 1, shown));
                shown++;
            });

            countText.textContent = "Showing " + shown + " of " + adaptations.length + " titles";
        }

        function count(type) {
            return adaptations.filter(function (item) { return item.type === type; }).length;
        }

        // numbers in the header come from the same array
        document.getElementById("stat-total").textContent = adaptations.length;
        document.getElementById("stat-anime").textContent = count("anime");
        document.getElementById("stat-live").textContent = count("live");

        buttons.forEach(function (btn) {
            btn.addEventListener("click", function () {
                buttons.forEach(function (b) {
                    const on = b === btn;
                    b.classList.toggle("is-active", on);
                    b.setAttribute("aria-pressed", on ? "true" : "false");
                });
                render(btn.dataset.filter);
            });
        });

        render("all");
    </script>

</body>
</html>
