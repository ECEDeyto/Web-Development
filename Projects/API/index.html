<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valorant Agents | Emmanuel Deyto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=3">
    <link rel="icon" href="favicon.ico?v=3" sizes="any">

    <style>
        /* ---------- LOADING SCREEN (hologram badge) ---------- */
        #loader {
            position: fixed; inset: 0; z-index: 9999;
            display: grid; place-items: center;
            background: radial-gradient(circle at 50% 42%, #1b1708 0, #070605 55%, #030302 100%);
            transition: opacity .6s ease, visibility .6s;
        }
        #loader.hide { opacity: 0; visibility: hidden; }
        body.is-loading { overflow: hidden; }

        .loader-inner { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 16px; }

        .holo-stage {
            position: relative;
            width: min(230px, 52vw);
            aspect-ratio: 1;
            perspective: 900px;
        }
        .holo {
            position: absolute; inset: 0;
            transform-style: preserve-3d;
            animation: holo-spin 7s linear infinite, holo-flicker 4.5s steps(1) infinite;
            filter: drop-shadow(0 0 14px rgba(201, 168, 76, .45));
        }
        .holo svg {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            overflow: visible;
            opacity: var(--o, 1);
            transform: translateZ(calc(var(--z, 0) * 1px));
        }

        /* thin scan lines over the hologram, and a bright beam sweeping down it */
        .holo-stage::before {
            content: ""; position: absolute; inset: -4%; z-index: 2; pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,.38) 0 1px, transparent 1px 4px);
            -webkit-mask-image: radial-gradient(circle, #000 38%, transparent 68%);
            mask-image: radial-gradient(circle, #000 38%, transparent 68%);
        }
        .holo-stage::after {
            content: ""; position: absolute; left: -6%; right: -6%; height: 22%; z-index: 3; pointer-events: none;
            background: linear-gradient(to bottom, transparent, rgba(255, 224, 120, .28), transparent);
            animation: holo-scan 2.6s linear infinite;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 28%, #000 72%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 28%, #000 72%, transparent);
        }

        /* the "projector" under the badge */
        .holo-base {
            position: relative; width: min(250px, 56vw); height: 40px; margin-top: -14px;
        }
        .holo-base i {
            position: absolute; left: 50%; top: 50%; border-radius: 50%;
            border: 2px solid rgba(201, 168, 76, .6);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 18px rgba(201, 168, 76, .35), inset 0 0 14px rgba(201, 168, 76, .2);
        }
        .holo-base i:nth-child(1) { width: 100%; height: 100%; }
        .holo-base i:nth-child(2) { width: 68%; height: 62%; border-color: rgba(255, 210, 31, .75); }
        .holo-base::after {
            content: ""; position: absolute; left: 14%; right: 14%; bottom: 50%; height: 180px;
            background: linear-gradient(to top, rgba(255, 210, 31, .16), transparent);
            clip-path: polygon(0 100%, 100% 100%, 82% 0, 18% 0); pointer-events: none;
        }

        .loader-text {
            margin: 6px 0 0; color: var(--gold-soft, #ead9a2);
            font-size: .85rem; letter-spacing: .4em; text-transform: uppercase; font-weight: 700;
        }
        .loader-text span { animation: holo-dot 1.2s infinite; opacity: .2; }
        .loader-text span:nth-child(2) { animation-delay: .2s; }
        .loader-text span:nth-child(3) { animation-delay: .4s; }
        .loader-bar { width: 180px; height: 2px; background: rgba(201, 168, 76, .2); overflow: hidden; }
        .loader-bar b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #c9a84c, #ffd21f); animation: holo-bar 1.8s ease-out forwards; }

        @keyframes holo-spin { to { transform: rotateY(360deg); } }
        @keyframes holo-scan { from { top: -22%; } to { top: 100%; } }
        @keyframes holo-flicker { 0%, 100% { opacity: 1; } 91% { opacity: .82; } 93% { opacity: 1; } 96% { opacity: .9; } }
        @keyframes holo-dot { 50% { opacity: 1; } }
        @keyframes holo-bar { to { width: 100%; } }

        @media (prefers-reduced-motion: reduce) {
            .holo, .holo-stage::after, .loader-text span { animation: none !important; }
            .loader-text span { opacity: 1; }
            .loader-bar b { animation-duration: .5s; }
        }

        /* ---------- HERO LOGO (slow 3D turn, centered under the intro) ---------- */

        /* ---------- GOLD BUTTON ---------- */
        .button-gold { background: var(--gold); border-color: var(--gold); color: var(--ink); }
        .button-gold:hover { background: var(--gold-soft); border-color: var(--gold-soft); color: var(--ink); }

        /* ---------- CARD TILT ---------- */
        /* once a card has finished its entrance animation, release it so it can tilt */
        .agent-card.rested { animation: none; }
    </style>
    <noscript><style>#loader { display: none !important; }</style></noscript>
</head>

<body>

    <!-- LOADING SCREEN -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <linearGradient id="badgeGrad" gradientUnits="userSpaceOnUse" x1="80" y1="130" x2="430" y2="390">
                <stop offset="0" stop-color="#ead9a2"/><stop offset=".5" stop-color="#c9a84c"/><stop offset="1" stop-color="#8a6d1c"/>
            </linearGradient>
            <clipPath id="badgeClip"><rect x="0" y="146" width="512" height="220"/></clipPath>
            <g id="badge-art">
                <g clip-path="url(#badgeClip)" fill="none" stroke="url(#badgeGrad)" stroke-width="34" stroke-linejoin="miter" stroke-miterlimit="10">
                    <path d="M204 112L92 256L204 400"/><path d="M308 112L420 256L308 400"/>
                </g>
                <path d="M232 196V316L310 256z" fill="url(#badgeGrad)"/>
            </g>
        </defs>
    </svg>

    <div id="loader" role="status" aria-label="Loading">
        <div class="loader-inner">
            <div class="holo-stage"><div class="holo" id="holo"></div></div>
            <div class="holo-base" aria-hidden="true"><i></i><i></i></div>
            <p class="loader-text">Loading<span>.</span><span>.</span><span>.</span></p>
            <div class="loader-bar" aria-hidden="true"><b></b></div>
        </div>
    </div>
    <script>
        // Hologram loading screen: shown once per visit, hides when the page has loaded
        (function () {
            var loader = document.getElementById('loader');
            if (!loader) return;

            var seen = false;
            try { seen = sessionStorage.getItem('logoLoaderSeen') === '1'; } catch (e) {}
            if (seen) { loader.remove(); return; }
            try { sessionStorage.setItem('logoLoaderSeen', '1'); } catch (e) {}

            // stack of copies of the badge, each a little deeper, so it turns like a 3D object
            var holo = document.getElementById('holo'), layers = 11, ns = 'http://www.w3.org/2000/svg';
            for (var i = 0; i < layers; i++) {
                var svg = document.createElementNS(ns, 'svg');
                svg.setAttribute('viewBox', '0 0 512 512');
                svg.setAttribute('aria-hidden', 'true');
                var use = document.createElementNS(ns, 'use');
                use.setAttribute('href', '#badge-art');
                svg.appendChild(use);
                svg.style.setProperty('--z', ((i - (layers - 1) / 2) * 3.5).toFixed(1));
                svg.style.setProperty('--o', (i === 0 || i === layers - 1) ? '1' : '0.28');
                holo.appendChild(svg);
            }

            document.body.classList.add('is-loading');

            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var minTime = reduce ? 500 : 1800;
            var start = Date.now(), loaded = document.readyState === 'complete', hidden = false;

            function hide() {
                if (hidden) return;
                hidden = true;
                loader.classList.add('hide');
                document.body.classList.remove('is-loading');
                setTimeout(function () { loader.remove(); }, 700);
            }
            function check() {
                if (!loaded) return;
                var wait = minTime - (Date.now() - start);
                if (wait <= 0) hide(); else setTimeout(hide, wait);
            }
            if (loaded) check(); else window.addEventListener('load', function () { loaded = true; check(); });
            setTimeout(hide, 7000);   // never trap a visitor on the loading screen
        })();
    </script>


    <header class="hero">
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>

        <div class="wrap">
            <span class="pill"><span class="pill-dot"></span>API project</span>
            <h1 class="gold-text">Valorant Agents</h1>
            <p>Every playable agent, loaded live from the Valorant API. Search by name, pick a role, then pick an agent to see their abilities.</p>
        </div>
    </header>

    <main class="page">
        <div class="wrap">

            <!-- Search -->
            <form class="search" id="searchForm" role="search">
                <label class="visually-hidden" for="search">Search agents by name</label>
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="search" type="search" placeholder="Search agents by name" autocomplete="off" spellcheck="false">
            </form>

            <!-- Role buttons are built from the API data -->
            <div class="filters" id="filters" role="group" aria-label="Filter by role"></div>

            <p class="result-count" id="count" aria-live="polite"></p>

            <nav class="pager pager-top" aria-label="Pages">
                <button type="button" class="button button-outline button-sm" data-go="-1">Previous</button>
                <span class="pager-label">Page <b class="cur">1</b> of <b class="last">1</b></span>
                <button type="button" class="button button-outline button-sm" data-go="1">Next</button>
            </nav>

            <div class="agent-grid" id="grid"></div>

            <div class="status empty" id="empty" hidden></div>

            <div class="status" id="status" role="status">
                <div class="spinner" aria-hidden="true"></div>
                Loading agents...
            </div>

            <nav class="pager pager-bottom" aria-label="Pages">
                <button type="button" class="button button-outline button-sm" data-go="-1">Previous</button>
                <span class="pager-label">Page <b class="cur">1</b> of <b class="last">1</b></span>
                <button type="button" class="button button-outline button-sm" data-go="1">Next</button>
            </nav>

            <div class="pager" style="margin-top: 3rem;">
                <a class="button button-gold" href="../webdev.html">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Back to Web Development
                </a>
            </div>

        </div>
    </main>

    <footer class="site-footer">
        © 2026 Deyto's Portfolio · Data from valorant-api.com
    </footer>

    <script>
        // The API: every agent you can play (no duplicates or test characters)
        const API_URL = "https://valorant-api.com/v1/agents?isPlayableCharacter=true";
        const PER_PAGE = 8;

        const grid = document.getElementById("grid");
        const statusBox = document.getElementById("status");
        const emptyBox = document.getElementById("empty");
        const filtersBox = document.getElementById("filters");
        const countText = document.getElementById("count");
        const searchInput = document.getElementById("search");
        const pagers = document.querySelectorAll(".pager[aria-label='Pages']");

        let agents = [];      // every agent, sorted A to Z
        let shown = [];       // the agents that match the search and the chosen role
        let lastPage = 1;

        // the link looks like index.html?q=ja&role=Duelist&page=1
        const params = new URLSearchParams(window.location.search);
        let query = params.get("q") || "";
        let role = params.get("role") || "all";
        let page = parseInt(params.get("page"), 10);
        if (!page || page < 1) page = 1;

        searchInput.value = query;

        function make(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        // lower case, no spaces or symbols, so "kayo" finds "KAY/O"
        function simplify(text) {
            return text.toLowerCase().replace(/[^a-z0-9]/g, "");
        }

        // the part of the link that remembers the search, the filter and the page
        function stateQuery() {
            let result = "page=" + page;
            if (role !== "all") result = "role=" + encodeURIComponent(role) + "&" + result;
            if (query.trim()) result = "q=" + encodeURIComponent(query.trim()) + "&" + result;
            return result;
        }

        function roleOf(agent) {
            return agent.role ? agent.role.displayName : "";
        }

        function buildCard(agent, order) {
            const card = make("a", "agent-card glow-ring");
            card.href = "view.html?id=" + encodeURIComponent(agent.uuid) + "&" + stateQuery();
            card.style.setProperty("--i", order);

            const avatar = make("div", "agent-avatar");
            const img = document.createElement("img");
            img.src = agent.displayIcon;
            img.alt = "";
            img.loading = "lazy";
            avatar.appendChild(img);

            const info = make("div", "agent-info");
            info.appendChild(make("h2", "agent-name", agent.displayName));

            if (agent.role) {
                const rolePill = make("span", "role-pill");
                if (agent.role.displayIcon) {
                    const icon = document.createElement("img");
                    icon.src = agent.role.displayIcon;
                    icon.alt = "";
                    rolePill.appendChild(icon);
                }
                rolePill.appendChild(document.createTextNode(agent.role.displayName));
                info.appendChild(rolePill);
            }

            card.appendChild(avatar);
            card.appendChild(info);
            return card;
        }

        // one button for "All" and one for every role found in the data
        function buildFilters() {
            const roles = {};   // role name -> icon
            agents.forEach(function (agent) {
                if (agent.role) roles[agent.role.displayName] = agent.role.displayIcon;
            });

            // if the link names a role that does not exist, show everyone
            if (role !== "all" && !(role in roles)) role = "all";

            filtersBox.innerHTML = "";
            filtersBox.appendChild(buildFilterButton("all", "All", null));
            Object.keys(roles).sort().forEach(function (name) {
                filtersBox.appendChild(buildFilterButton(name, name, roles[name]));
            });
        }

        function buildFilterButton(value, label, iconUrl) {
            const btn = make("button", "filter-btn");
            btn.type = "button";
            btn.dataset.role = value;

            if (iconUrl) {
                const icon = document.createElement("img");
                icon.src = iconUrl;
                icon.alt = "";
                btn.appendChild(icon);
            }
            btn.appendChild(document.createTextNode(label));
            btn.appendChild(make("span", "filter-count", "0"));

            btn.addEventListener("click", function () {
                role = value;
                page = 1;            // a new filter starts at the first page
                render();
            });
            return btn;
        }

        function render() {
            // 1. the search: keep the agents whose name contains what was typed
            const wanted = simplify(query);
            const searched = agents.filter(function (agent) {
                return simplify(agent.displayName).includes(wanted);
            });

            // 2. the role buttons count the agents that match the search
            const counts = { all: searched.length };
            searched.forEach(function (agent) {
                counts[roleOf(agent)] = (counts[roleOf(agent)] || 0) + 1;
            });
            filtersBox.querySelectorAll(".filter-btn").forEach(function (btn) {
                const on = btn.dataset.role === role;
                btn.classList.toggle("is-active", on);
                btn.setAttribute("aria-pressed", on ? "true" : "false");
                btn.querySelector(".filter-count").textContent = counts[btn.dataset.role] || 0;
            });

            // 3. the role: keep only the agents of the chosen role
            shown = role === "all" ? searched : searched.filter(function (a) { return roleOf(a) === role; });

            // 4. split the result into pages
            lastPage = Math.max(1, Math.ceil(shown.length / PER_PAGE));
            if (page > lastPage) page = 1;

            // 5. draw the cards of this page
            grid.innerHTML = "";
            const start = (page - 1) * PER_PAGE;
            shown.slice(start, start + PER_PAGE).forEach(function (agent, i) {
                grid.appendChild(buildCard(agent, i));
            });

            // 6. the message under the buttons
            const noun = role === "all" ? "agent" : role.toLowerCase();
            const label = noun + (shown.length === 1 ? "" : "s");
            let text = shown.length
                ? "Showing " + (start + 1) + " to " + Math.min(start + PER_PAGE, shown.length) + " of " + shown.length + " " + label
                : "No " + label + " found";
            if (query.trim()) text += " for \"" + query.trim() + "\"";
            countText.textContent = text;

            // nothing matched: say so and offer a way out
            emptyBox.hidden = shown.length > 0;
            if (!emptyBox.hidden) {
                emptyBox.textContent = "No agents match your search. Try another name, or choose a different role.";
            }

            pagers.forEach(function (p) {
                p.querySelector(".cur").textContent = page;
                p.querySelector(".last").textContent = lastPage;
                p.hidden = lastPage === 1;    // nothing to page through
            });

            // keep the search, the filter and the page in the address, so refresh and the back link still work
            history.replaceState(null, "", "?" + stateQuery());
        }

        function go(step) {
            page += step;                       // page is a number, so this adds
            if (page < 1) page = lastPage;      // before the first page -> last page
            if (page > lastPage) page = 1;      // after the last page -> first page
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        document.querySelectorAll("[data-go]").forEach(function (btn) {
            btn.addEventListener("click", function () { go(Number(btn.dataset.go)); });
        });

        // search while typing; Enter does not reload the page
        searchInput.addEventListener("input", function () {
            query = searchInput.value;
            page = 1;                    // a new search starts at the first page
            if (agents.length) render();
        });
        document.getElementById("searchForm").addEventListener("submit", function (event) {
            event.preventDefault();
        });

        async function loadAgents() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("HTTP " + response.status);
                const json = await response.json();

                agents = json.data.slice().sort(function (a, b) {
                    return a.displayName.localeCompare(b.displayName);
                });

                statusBox.hidden = true;
                buildFilters();
                render();
            } catch (error) {
                console.error(error);
                statusBox.className = "status error";
                statusBox.textContent = "Could not load the agents. Check your internet connection, then refresh the page.";
            }
        }

        loadAgents();
    </script>

    <script>
        // Cards lean toward the mouse when hovered (mouse only, and not for reduced motion)
        (function () {
            var grid = document.getElementById('grid');
            if (!grid) return;

            // the entrance animation would hold the card still, so let go of it when it ends
            grid.addEventListener('animationend', function (e) {
                if (e.animationName === 'rise' && e.target.classList) e.target.classList.add('rested');
            });

            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

            var current = null;
            function reset(card) { if (card) { card.style.transition = ''; card.style.transform = ''; } }

            grid.addEventListener('pointermove', function (e) {
                if (e.pointerType && e.pointerType !== 'mouse') return;
                var card = e.target.closest ? e.target.closest('.agent-card') : null;
                if (card !== current) { reset(current); current = card; }
                if (!card || !card.classList.contains('rested')) return;
                var r = card.getBoundingClientRect();
                var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
                var max = r.width > 520 ? 3 : r.width > 340 ? 5 : 8;      // big cards lean less
                var ry = (px - 0.5) * 2 * max, rx = -(py - 0.5) * 2 * max;
                card.style.transition = 'transform .12s ease-out, box-shadow .3s ease, border-color .25s';
                card.style.transform = 'perspective(900px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg) translateY(-3px) scale(1.01)';
            });
            grid.addEventListener('pointerleave', function () { reset(current); current = null; });
        })();
    </script>

</body>
</html>
