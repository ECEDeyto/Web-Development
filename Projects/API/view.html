<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valorant Agent | Emmanuel Deyto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=3">
    <link rel="icon" href="favicon.ico?v=3" sizes="any">

    <style>
        /* ---------- LOADING SCREEN (hologram badge) ---------- */
        #loader {
            position: fixed; inset: 0; z-index: 9999;
            display: grid; place-items: center;
            background: radial-gradient(circle at 50% 42%, #1b1708 0, #070605 55%, #030302 100%);
            transition: opacity .6s ease, visibility .6s;
        }
        #loader.hide { opacity: 0; visibility: hidden; }
        body.is-loading { overflow: hidden; }

        .loader-inner { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 16px; }

        .holo-stage {
            position: relative;
            width: min(230px, 52vw);
            aspect-ratio: 1;
            perspective: 900px;
        }
        .holo {
            position: absolute; inset: 0;
            transform-style: preserve-3d;
            animation: holo-spin 7s linear infinite, holo-flicker 4.5s steps(1) infinite;
            filter: drop-shadow(0 0 14px rgba(201, 168, 76, .45));
        }
        .holo svg {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            overflow: visible;
            opacity: var(--o, 1);
            transform: translateZ(calc(var(--z, 0) * 1px));
        }

        /* thin scan lines over the hologram, and a bright beam sweeping down it */
        .holo-stage::before {
            content: ""; position: absolute; inset: -4%; z-index: 2; pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,.38) 0 1px, transparent 1px 4px);
            -webkit-mask-image: radial-gradient(circle, #000 38%, transparent 68%);
            mask-image: radial-gradient(circle, #000 38%, transparent 68%);
        }
        .holo-stage::after {
            content: ""; position: absolute; left: -6%; right: -6%; height: 22%; z-index: 3; pointer-events: none;
            background: linear-gradient(to bottom, transparent, rgba(255, 224, 120, .28), transparent);
            animation: holo-scan 2.6s linear infinite;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 28%, #000 72%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 28%, #000 72%, transparent);
        }

        /* the "projector" under the badge */
        .holo-base {
            position: relative; width: min(250px, 56vw); height: 40px; margin-top: -14px;
        }
        .holo-base i {
            position: absolute; left: 50%; top: 50%; border-radius: 50%;
            border: 2px solid rgba(201, 168, 76, .6);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 18px rgba(201, 168, 76, .35), inset 0 0 14px rgba(201, 168, 76, .2);
        }
        .holo-base i:nth-child(1) { width: 100%; height: 100%; }
        .holo-base i:nth-child(2) { width: 68%; height: 62%; border-color: rgba(255, 210, 31, .75); }
        .holo-base::after {
            content: ""; position: absolute; left: 14%; right: 14%; bottom: 50%; height: 180px;
            background: linear-gradient(to top, rgba(255, 210, 31, .16), transparent);
            clip-path: polygon(0 100%, 100% 100%, 82% 0, 18% 0); pointer-events: none;
        }

        .loader-text {
            margin: 6px 0 0; color: var(--gold-soft, #ead9a2);
            font-size: .85rem; letter-spacing: .4em; text-transform: uppercase; font-weight: 700;
        }
        .loader-text span { animation: holo-dot 1.2s infinite; opacity: .2; }
        .loader-text span:nth-child(2) { animation-delay: .2s; }
        .loader-text span:nth-child(3) { animation-delay: .4s; }
        .loader-bar { width: 180px; height: 2px; background: rgba(201, 168, 76, .2); overflow: hidden; }
        .loader-bar b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #c9a84c, #ffd21f); animation: holo-bar 1.8s ease-out forwards; }

        @keyframes holo-spin { to { transform: rotateY(360deg); } }
        @keyframes holo-scan { from { top: -22%; } to { top: 100%; } }
        @keyframes holo-flicker { 0%, 100% { opacity: 1; } 91% { opacity: .82; } 93% { opacity: 1; } 96% { opacity: .9; } }
        @keyframes holo-dot { 50% { opacity: 1; } }
        @keyframes holo-bar { to { width: 100%; } }

        @media (prefers-reduced-motion: reduce) {
            .holo, .holo-stage::after, .loader-text span { animation: none !important; }
            .loader-text span { opacity: 1; }
            .loader-bar b { animation-duration: .5s; }
        }

        /* ---------- HERO LOGO (slow 3D turn, centered under the intro) ---------- */

        /* ---------- GOLD BUTTON ---------- */
        .button-gold { background: var(--gold); border-color: var(--gold); color: var(--ink); }
        .button-gold:hover { background: var(--gold-soft); border-color: var(--gold-soft); color: var(--ink); }
    </style>
    <noscript><style>#loader { display: none !important; }</style></noscript>
</head>

<body>

    <!-- LOADING SCREEN -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <linearGradient id="badgeGrad" gradientUnits="userSpaceOnUse" x1="80" y1="130" x2="430" y2="390">
                <stop offset="0" stop-color="#ead9a2"/><stop offset=".5" stop-color="#c9a84c"/><stop offset="1" stop-color="#8a6d1c"/>
            </linearGradient>
            <clipPath id="badgeClip"><rect x="0" y="146" width="512" height="220"/></clipPath>
            <g id="badge-art">
                <g clip-path="url(#badgeClip)" fill="none" stroke="url(#badgeGrad)" stroke-width="34" stroke-linejoin="miter" stroke-miterlimit="10">
                    <path d="M204 112L92 256L204 400"/><path d="M308 112L420 256L308 400"/>
                </g>
                <path d="M232 196V316L310 256z" fill="url(#badgeGrad)"/>
            </g>
        </defs>
    </svg>

    <div id="loader" role="status" aria-label="Loading">
        <div class="loader-inner">
            <div class="holo-stage"><div class="holo" id="holo"></div></div>
            <div class="holo-base" aria-hidden="true"><i></i><i></i></div>
            <p class="loader-text">Loading<span>.</span><span>.</span><span>.</span></p>
            <div class="loader-bar" aria-hidden="true"><b></b></div>
        </div>
    </div>
    <script>
        // Hologram loading screen: shown once per visit, hides when the page has loaded
        (function () {
            var loader = document.getElementById('loader');
            if (!loader) return;

            var seen = false;
            try { seen = sessionStorage.getItem('logoLoaderSeen') === '1'; } catch (e) {}
            if (seen) { loader.remove(); return; }
            try { sessionStorage.setItem('logoLoaderSeen', '1'); } catch (e) {}

            // stack of copies of the badge, each a little deeper, so it turns like a 3D object
            var holo = document.getElementById('holo'), layers = 11, ns = 'http://www.w3.org/2000/svg';
            for (var i = 0; i < layers; i++) {
                var svg = document.createElementNS(ns, 'svg');
                svg.setAttribute('viewBox', '0 0 512 512');
                svg.setAttribute('aria-hidden', 'true');
                var use = document.createElementNS(ns, 'use');
                use.setAttribute('href', '#badge-art');
                svg.appendChild(use);
                svg.style.setProperty('--z', ((i - (layers - 1) / 2) * 3.5).toFixed(1));
                svg.style.setProperty('--o', (i === 0 || i === layers - 1) ? '1' : '0.28');
                holo.appendChild(svg);
            }

            document.body.classList.add('is-loading');

            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var minTime = reduce ? 500 : 1800;
            var start = Date.now(), loaded = document.readyState === 'complete', hidden = false;

            function hide() {
                if (hidden) return;
                hidden = true;
                loader.classList.add('hide');
                document.body.classList.remove('is-loading');
                setTimeout(function () { loader.remove(); }, 700);
            }
            function check() {
                if (!loaded) return;
                var wait = minTime - (Date.now() - start);
                if (wait <= 0) hide(); else setTimeout(hide, wait);
            }
            if (loaded) check(); else window.addEventListener('load', function () { loaded = true; check(); });
            setTimeout(hide, 7000);   // never trap a visitor on the loading screen
        })();
    </script>


    <main class="page">
        <div class="wrap">

            <div class="back-row">
                <a class="button button-gold button-sm" id="backlink" href="index.html">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Back to list
                </a>
            </div>

            <div class="status" id="status" role="status">
                <div class="spinner" aria-hidden="true"></div>
                Loading agent...
            </div>

            <article class="detail" id="detail" hidden>
                <div class="portrait">
                    <img id="portrait" src="" alt="">
                </div>

                <div>
                    <span class="role-pill" id="role"></span>
                    <h1 class="detail-name gold-text" id="name"></h1>
                    <p class="detail-text" id="description"></p>

                    <h2 class="section-title">Abilities</h2>
                    <ul class="ability-list" id="abilities"></ul>
                </div>
            </article>

        </div>
    </main>

    <footer class="site-footer">
        © 2026 Deyto's Portfolio · Data from valorant-api.com
    </footer>

    <script>
        const API_URL = "https://valorant-api.com/v1/agents/";

        // the link looks like view.html?id=AGENT-ID&q=ja&role=Duelist&page=2
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const role = params.get("role");
        const search = params.get("q");
        let page = parseInt(params.get("page"), 10);
        if (!page || page < 1) page = 1;

        // go back to the same search, the same filter and the same page of the list
        let backQuery = "page=" + page;
        if (role) backQuery = "role=" + encodeURIComponent(role) + "&" + backQuery;
        if (search) backQuery = "q=" + encodeURIComponent(search) + "&" + backQuery;
        document.getElementById("backlink").href = "index.html?" + backQuery;

        const statusBox = document.getElementById("status");
        const detail = document.getElementById("detail");

        // the game lists these slots by these names
        const SLOT_LABELS = { Ultimate: "Ultimate", Passive: "Passive" };

        function make(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        // The API writes descriptions with the game's own tags, for example:
        //   ACTIVATE a <whitebold>Star</> to detonate it, <debuffred>concussing</> all players hit.
        // Text inside a tag becomes bold, and the tags themselves are never shown.
        function fillText(parent, text) {
            const pattern = /<(\w+)>(.*?)<\/>/g;
            let last = 0;
            let match;

            function plain(str) {
                // remove any leftover tag such as <foo> or </>
                const clean = str.replace(/<\/?\w*>/g, "");
                if (clean) parent.appendChild(document.createTextNode(clean));
            }

            while ((match = pattern.exec(text)) !== null) {
                plain(text.slice(last, match.index));
                parent.appendChild(make("strong", "hl", match[2].replace(/<\/?\w*>/g, "")));
                last = pattern.lastIndex;
            }
            plain(text.slice(last));
        }

        function showError(message) {
            statusBox.className = "status error";
            statusBox.textContent = message;
            statusBox.hidden = false;
            detail.hidden = true;
        }

        function buildAbility(ability) {
            const row = make("li", "ability glow-ring");

            const iconBox = make("div", "ability-icon");
            if (ability.displayIcon) {
                const icon = document.createElement("img");
                icon.src = ability.displayIcon;
                icon.alt = "";
                iconBox.appendChild(icon);
            }

            const text = make("div");
            const title = make("h3", "", ability.displayName);
            if (SLOT_LABELS[ability.slot]) {
                title.appendChild(make("span", "slot", SLOT_LABELS[ability.slot]));
            }
            text.appendChild(title);
            const description = make("p");
            fillText(description, ability.description || "");
            text.appendChild(description);

            row.appendChild(iconBox);
            row.appendChild(text);
            return row;
        }

        function show(agent) {
            document.title = agent.displayName + " | Valorant Agents";

            const portrait = document.getElementById("portrait");
            portrait.src = agent.fullPortrait || agent.bustPortrait || agent.displayIcon;
            portrait.alt = agent.displayName;

            document.getElementById("name").textContent = agent.displayName;
            fillText(document.getElementById("description"), agent.description || "");

            const role = document.getElementById("role");
            if (agent.role) {
                if (agent.role.displayIcon) {
                    const icon = document.createElement("img");
                    icon.src = agent.role.displayIcon;
                    icon.alt = "";
                    role.appendChild(icon);
                }
                role.appendChild(document.createTextNode(agent.role.displayName));
            } else {
                role.hidden = true;
            }

            const list = document.getElementById("abilities");
            (agent.abilities || []).forEach(function (ability) {
                list.appendChild(buildAbility(ability));
            });

            statusBox.hidden = true;
            detail.hidden = false;
        }

        async function loadAgent() {
            if (!id) {
                showError("No agent was chosen. Go back to the list and pick one.");
                return;
            }
            try {
                const response = await fetch(API_URL + encodeURIComponent(id));
                if (response.status === 404) {
                    showError("That agent was not found. Go back to the list and pick another one.");
                    return;
                }
                if (!response.ok) throw new Error("HTTP " + response.status);
                const json = await response.json();
                show(json.data);
            } catch (error) {
                console.error(error);
                showError("Could not load this agent. Check your internet connection, then refresh the page.");
            }
        }

        loadAgent();
    </script>

</body>
</html>
